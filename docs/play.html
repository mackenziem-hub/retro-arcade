<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Retro Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body class="play">
<div class="hud">
  <button class="btn" id="menuBtn">&#9776;</button>
  <button class="btn" id="saveNow">Save</button>
  <button class="btn" id="stylus" hidden>Stylus</button>
  <button class="btn" id="swap" hidden>Swap</button>
  <span id="status" class="muted"></span>
  <span id="dsHint" class="muted" hidden>Click the bottom screen to use the stylus, or turn on the virtual stylus in the menu</span>
  <span id="stylusHint" class="muted" hidden>Stylus: right stick or I J K L, tap with right trigger or Space</span>
</div>
<div id="game"></div>
<div id="stylusCursor" class="stylusCursor" hidden></div>
<div id="tapToPlay" class="tapToPlay" hidden><div>Tap to play</div></div>

<dialog id="quickDlg" class="quick">
  <h3 style="margin-top:0">Game menu</h3>
  <div class="qgrid">
    <button type="button" class="btn primary" id="quickResume" data-nav>Resume</button>
    <button type="button" class="btn" id="quickBack" data-nav>Go back to an earlier moment</button>
    <button type="button" class="btn" id="shotBtn" data-nav>Screenshot</button>
    <button type="button" class="btn" id="ffBtn" data-nav>Fast forward</button>
    <button type="button" class="btn" id="swapBtn" hidden data-nav>Swap DS screens</button>
    <button type="button" class="btn" id="stylusBtn" hidden data-nav>Virtual stylus</button>
  </div>
  <div id="quickSlots" class="slots"></div>
  <div class="btns"><button type="button" class="btn danger" id="quickExit" data-nav>Back to arcade menu</button></div>
</dialog>
<dialog id="historyDlg">
  <h3 style="margin-top:0">Go back to an earlier moment</h3>
  <div id="historyList" class="histList"></div>
  <div class="btns"><button type="button" class="btn" id="historyClose" data-cancel data-nav>Cancel</button></div>
</dialog>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct"></button></div>

<script src="config.js"></script>
<script src="store.js"></script>
<script src="sync.js"></script>
<script src="nav.js"></script>
<script src="player.js"></script>
<script>
// Phone: the game file and saves live on this phone; saves also go to the family store when connected.
(async () => {
  const params = new URLSearchParams(location.search);
  const gameId = params.get('game'), userId = params.get('user');
  Sync.load();
  const g = await Store.game(gameId);
  if (!g) { document.getElementById('game').innerHTML = '<p style="padding:80px 20px">Game not found on this phone.</p>'; return; }
  const file = await Store.gameFile(g.id);
  // Opening a game: first send this phone's unsent play for it. If another device saved since, the family copy
  // wins and this phone's copy is kept (Go back list for snapshots). If the store cannot be reached, say so.
  const getSave = async kind => {
    let local = await Store.getSave(userId, gameId, kind);
    let cloudUnreachable = false;
    if (Sync.configured()) {
      if (!Sync.ready()) cloudUnreachable = true;
      else try {
        let conflict = false;
        if (local && (local.dirty || local.base === undefined)) {
          const r = await Sync.upload(userId, gameId, kind, local.bytes, local.at, local.base !== undefined ? local.base : local.at);
          if (r.result === 'ok') await Store.markSynced(userId, gameId, kind, local.at);
          else if (r.result === 'conflict') conflict = true;
          else if (r.result === 'error') cloudUnreachable = true;
        }
        const remote = conflict ? await Sync.fetchLatest(userId, gameId, kind) : await Sync.fetchNewer(userId, gameId, kind, local && local.at);
        if (remote) {
          await Store.keepLocal(userId, gameId, kind);
          await Store.putSave(userId, gameId, kind, remote.bytes, remote.at, { dirty: false, base: remote.at });
          return { ...remote, fromCloud: true };
        }
        if (local && local.base === undefined && !local.dirty) await Store.markSynced(userId, gameId, kind, local.at);
      } catch (e) { console.warn('cloud check failed', e); cloudUnreachable = true; }
    }
    if (local) return { ...local, cloudUnreachable };
    return cloudUnreachable ? { bytes: null, cloudUnreachable } : null;
  };
  ArcadePlayer({
    game: g, menuUrl: './#lib', dataPath: Store.EJS_DATA, gameUrl: URL.createObjectURL(file),
    getSave,
    peekSave: async kind => { const s = await Store.getSave(userId, gameId, kind); return s ? { at: s.at } : null; },
    // Saved on the phone first; then sent to the family store unless another device saved newer progress there.
    async putSave(kind, bytes, at) {
      const prev = await Store.getSave(userId, gameId, kind);
      await Store.putSave(userId, gameId, kind, bytes, at);
      const base = prev ? (prev.base !== undefined ? prev.base : prev.at) : 0;
      Sync.upload(userId, gameId, kind, bytes, at, base).then(async r => {
        if (r.result === 'ok') await Store.markSynced(userId, gameId, kind, at);
        else if (r.result === 'conflict' && this.notifyConflict) this.notifyConflict(r.device);
      });
    },
    async history() {
      const local = (await Store.snapshots(userId, gameId)).map(s => ({ id: 'local:' + s.slot, label: 'On this phone', at: s.at }));
      let remote = [];
      try { remote = (await Sync.history(userId, gameId, 'state')).map(h => ({ id: 'cloud:' + h.id, label: 'Family store' + (h.device ? ' (' + h.device + ')' : ''), at: new Date(h.updated_at).getTime() })); } catch {}
      return [...local, ...remote].sort((a, b) => b.at - a.at);
    },
    async historyBytes(id) {
      const [where, key] = id.split(':');
      return where === 'local' ? Store.snapshot(userId, gameId, key) : Sync.historyBytes(key);
    },
    async addPlaytime(mins) {
      const users = await Store.users();
      const u = users.find(x => x.id === userId); if (!u) return;
      u.play = u.play || {}; u.play[gameId] = (u.play[gameId] || 0) + mins;
      const at = Date.now();
      await Store.replaceUsers(users, at); await Store.meta.set('profilesDirty', true);
      if (Sync.ready()) { try { await Sync.pushProfiles(users, at); await Store.meta.set('profilesDirty', false); } catch {} }
    },
  });
})();
</script>
</body>
</html>
