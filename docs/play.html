<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Retro Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body class="play">
<div class="hud">
  <button class="btn" id="exit">&larr; Menu</button>
  <button class="btn" id="saveNow">Save</button>
  <button class="btn" id="back" title="Load an earlier snapshot">Go back</button>
  <button class="btn" id="stylus" hidden>Stylus</button>
  <button class="btn" id="swap" hidden>Swap</button>
  <span id="status" style="font-size:13px;color:var(--muted)"></span>
  <span id="dsHint" class="muted" hidden>Click the bottom screen to use the stylus</span>
</div>
<div id="game"></div>
<dialog id="historyDlg">
  <h3 style="margin-top:0">Go back to an earlier moment</h3>
  <div id="historyList" class="histList"></div>
  <div class="btns"><button type="button" class="btn" id="historyClose">Cancel</button></div>
</dialog>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct"></button></div>

<script src="config.js"></script>
<script src="store.js"></script>
<script src="sync.js"></script>
<script src="player.js"></script>
<script>
// Phone: the game file and saves live on this phone; saves also go to the family store when connected.
(async () => {
  const params = new URLSearchParams(location.search);
  const gameId = params.get('game'), userId = params.get('user');
  Sync.load();
  const g = await Store.game(gameId);
  if (!g) { document.getElementById('game').innerHTML = '<p style="padding:80px 20px">Game not found on this phone.</p>'; return; }
  const file = await Store.gameFile(g.id);
  ArcadePlayer({
    game: g, menuUrl: './#lib', dataPath: Store.EJS_DATA, gameUrl: URL.createObjectURL(file),
    async getSave(kind) {
      const local = await Store.getSave(userId, gameId, kind);
      let remote = null;
      try { remote = await Sync.fetchNewer(userId, gameId, kind, local && local.at); } catch (e) { console.warn('cloud check failed', e); }
      if (remote) { await Store.putSave(userId, gameId, kind, remote.bytes, remote.at); return { ...remote, fromCloud: true }; }
      return local;
    },
    async putSave(kind, bytes, at) { await Store.putSave(userId, gameId, kind, bytes, at); Sync.upload(userId, gameId, kind, bytes, at); },
    async history() {
      const local = (await Store.snapshots(userId, gameId)).map(s => ({ id: 'local:' + s.slot, label: 'On this phone', at: s.at }));
      let remote = [];
      try { remote = (await Sync.history(userId, gameId, 'state')).map(h => ({ id: 'cloud:' + h.id, label: 'Family store' + (h.device ? ' (' + h.device + ')' : ''), at: new Date(h.updated_at).getTime() })); } catch {}
      return [...local, ...remote].sort((a, b) => b.at - a.at);
    },
    async historyBytes(id) {
      const [where, key] = id.split(':');
      return where === 'local' ? Store.snapshot(userId, gameId, key) : Sync.historyBytes(key);
    },
  });
})();
</script>
</body>
</html>
