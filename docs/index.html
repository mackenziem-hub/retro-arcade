<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1020">
<title>Retro Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="phone.css">
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="picker" multiple hidden>
<input type="file" id="restorePicker" accept=".json" hidden>

<dialog id="userDlg">
  <form method="dialog" id="userForm">
    <h3 id="userDlgTitle" style="margin-top:0">New player</h3>
    <input type="text" id="userName" maxlength="20" placeholder="Name" autocomplete="off" required data-nav>
    <div class="colors" id="userColors"></div>
    <label class="check"><input type="checkbox" id="userKid" data-nav> Kid mode (bigger tiles, hidden games stay hidden)</label>
    <button type="button" class="link" id="userPin" hidden data-nav>Change parent PIN</button>
    <div class="btns">
      <button type="button" class="btn danger" id="userDelete" hidden data-nav>Remove</button>
      <button type="button" class="btn" id="userCancel" data-cancel data-nav>Cancel</button>
      <button type="submit" class="btn primary" data-nav>Save</button>
    </div>
  </form>
</dialog>

<dialog id="pinDlg">
  <h3 id="pinTitle" style="margin-top:0">Parent PIN</h3>
  <p class="hint" id="pinMsg"></p>
  <div class="pin-dots" id="pinDots"></div>
  <div class="pin-pad" id="pinPad"></div>
  <div class="btns">
    <button type="button" class="btn" id="pinCancel" data-cancel data-nav>Cancel</button>
    <button type="button" class="btn primary" id="pinOk" data-nav>OK</button>
  </div>
</dialog>

<dialog id="syncDlg">
  <form method="dialog" id="syncForm">
    <h3 style="margin-top:0">Family saves</h3>
    <p class="muted" id="syncStatus" style="margin-top:0"></p>
    <input type="text" id="syncCode" placeholder="Family code" autocomplete="off" autocapitalize="off" data-nav>
    <div class="btns" id="syncExtras" style="justify-content:flex-start;flex-wrap:wrap"></div>
    <div class="btns">
      <button type="button" class="btn danger" id="syncDisconnect" hidden data-nav>Disconnect</button>
      <button type="button" class="btn" id="syncCancel" data-cancel data-nav>Close</button>
      <button type="submit" class="btn primary" data-nav>Connect</button>
    </div>
  </form>
</dialog>

<dialog id="popDlg">
  <h3 id="popTitle" style="margin-top:0"></h3>
  <div id="popList" class="histList"></div>
  <div class="btns"><button type="button" class="btn" id="popCancel" data-cancel data-nav>Cancel</button></div>
</dialog>

<dialog id="importDlg">
  <h3 style="margin-top:0">Add games</h3>
  <p class="hint" style="margin-top:0">Check the system for each game, then tap Add.</p>
  <div id="importList"></div>
  <div class="progress"><div id="importBar"></div></div>
  <div class="btns">
    <button type="button" class="btn" id="importCancel" data-cancel data-nav>Cancel</button>
    <button type="button" class="btn primary" id="importGo" data-nav>Add</button>
  </div>
</dialog>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct"></button></div>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="sync.js"></script>
<script src="nav.js"></script>
<script src="menu.js"></script>
<script src="phone.js"></script>
</body>
</html>
