<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Retro Arcade</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="play">
<div class="hud">
  <button class="btn" id="menuBtn">&#9776; Menu</button>
  <button class="btn" id="saveNow">Save</button>
  <button class="btn" id="stylus" hidden>Stylus</button>
  <button class="btn" id="swap" hidden>Swap screens</button>
  <span id="status" class="muted"></span>
  <span id="dsHint" class="muted" hidden>Click the bottom screen to use the stylus, or turn on the virtual stylus in the menu</span>
  <span id="stylusHint" class="muted" hidden>Stylus: right stick or I J K L, tap with right trigger or Space</span>
</div>
<div id="game"></div>
<div id="stylusCursor" class="stylusCursor" hidden></div>
<div id="tapToPlay" class="tapToPlay" hidden><div>Tap to play</div></div>

<dialog id="quickDlg" class="quick">
  <h3 style="margin-top:0">Game menu</h3>
  <div class="qgrid">
    <button type="button" class="btn primary" id="quickResume" data-nav>Resume</button>
    <button type="button" class="btn" id="quickBack" data-nav>Go back to an earlier moment</button>
    <button type="button" class="btn" id="shotBtn" data-nav>Screenshot</button>
    <button type="button" class="btn" id="ffBtn" data-nav>Fast forward</button>
    <button type="button" class="btn" id="swapBtn" hidden data-nav>Swap DS screens</button>
    <button type="button" class="btn" id="stylusBtn" hidden data-nav>Virtual stylus</button>
  </div>
  <div id="quickSlots" class="slots"></div>
  <div class="btns"><button type="button" class="btn danger" id="quickExit" data-nav>Back to arcade menu</button></div>
</dialog>
<dialog id="historyDlg">
  <h3 style="margin-top:0">Go back to an earlier moment</h3>
  <div id="historyList" class="histList"></div>
  <div class="btns"><button type="button" class="btn" id="historyClose" data-cancel data-nav>Cancel</button></div>
</dialog>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct"></button></div>

<script src="/nav.js"></script>
<script src="/player.js"></script>
<script>
// Computer arcade: saves live on this computer (and in the family store when it is connected).
(async () => {
  const params = new URLSearchParams(location.search);
  const gameId = params.get('game'), userId = params.get('user');
  const api = (p, q) => '/api/' + p + '?user=' + encodeURIComponent(userId) + '&game=' + encodeURIComponent(gameId) + (q || '');
  const lib = await (await fetch('/api/library')).json();
  const g = (lib.games || []).find(x => x.id === gameId);
  if (!g) { document.getElementById('game').innerHTML = '<p style="padding:80px 20px">Game not found.</p>'; return; }
  const getSave = async kind => {
    const r = await fetch(api('save', '&kind=' + kind));
    if (!r.ok) return null;
    return { bytes: new Uint8Array(await r.arrayBuffer()), at: +r.headers.get('X-Saved-At') || 0, fromCloud: r.headers.get('X-From-Cloud') === '1' };
  };
  ArcadePlayer({
    game: g, menuUrl: '/#lib', dataPath: '/emulatorjs/', gameUrl: g.url,
    biosUrl: g.system === 'psx' && lib.biosPsx ? '/bios/scph5501.bin' : null,
    threads: g.system === 'psp' && window.crossOriginIsolated,
    getSave,
    async peekSave(kind) { const r = await fetch(api('save', '&kind=' + kind + '&peek=1')); return r.ok ? { at: +r.headers.get('X-Saved-At') || 0 } : null; },
    putSave: (kind, bytes, at) => fetch(api('save', '&kind=' + kind + '&at=' + at), { method: 'POST', body: bytes }),
    history: async () => (await (await fetch(api('history'))).json()).history || [],
    async historyBytes(id) {
      const r = await fetch(api('history', '&id=' + encodeURIComponent(id)));
      if (!r.ok) throw new Error('missing');
      return { bytes: new Uint8Array(await r.arrayBuffer()), at: +r.headers.get('X-Saved-At') || 0 };
    },
    async addPlaytime(mins) {
      const users = await (await fetch('/api/users')).json();
      const u = users.find(x => x.id === userId); if (!u) return;
      u.play = u.play || {}; u.play[gameId] = (u.play[gameId] || 0) + mins;
      await fetch('/api/users', { method: 'POST', body: JSON.stringify(users) });
    },
  });
})();
</script>
</body>
</html>
