<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Retro Arcade</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="play">
<div class="hud">
  <button class="btn" id="exit">&larr; Menu</button>
  <button class="btn" id="saveNow">Save</button>
  <button class="btn" id="back" title="Load an earlier snapshot">Go back</button>
  <button class="btn" id="stylus" hidden>Stylus</button>
  <button class="btn" id="swap" hidden>Swap screens</button>
  <span id="status" style="font-size:13px;color:var(--muted)"></span>
  <span id="dsHint" class="muted" hidden>Click the bottom screen to use the stylus</span>
</div>
<div id="game"></div>
<dialog id="historyDlg">
  <h3 style="margin-top:0">Go back to an earlier moment</h3>
  <div id="historyList" class="histList"></div>
  <div class="btns"><button type="button" class="btn" id="historyClose">Cancel</button></div>
</dialog>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct"></button></div>

<script src="/player.js"></script>
<script>
// Computer arcade: saves live on this computer (and in the family store when it is connected).
(async () => {
  const params = new URLSearchParams(location.search);
  const gameId = params.get('game'), userId = params.get('user');
  const api = (p, q) => '/api/' + p + '?user=' + encodeURIComponent(userId) + '&game=' + encodeURIComponent(gameId) + (q || '');
  const lib = await (await fetch('/api/library')).json();
  const g = (lib.games || []).find(x => x.id === gameId);
  if (!g) { document.getElementById('game').innerHTML = '<p style="padding:80px 20px">Game not found.</p>'; return; }
  ArcadePlayer({
    game: g, menuUrl: '/#lib', dataPath: '/emulatorjs/', gameUrl: g.url,
    biosUrl: g.system === 'psx' && lib.biosPsx ? '/bios/scph5501.bin' : null,
    threads: g.system === 'psp' && window.crossOriginIsolated,
    async getSave(kind) {
      const r = await fetch(api('save', '&kind=' + kind));
      if (!r.ok) return null;
      return { bytes: new Uint8Array(await r.arrayBuffer()), at: +r.headers.get('X-Saved-At') || 0, fromCloud: r.headers.get('X-From-Cloud') === '1' };
    },
    putSave: (kind, bytes, at) => fetch(api('save', '&kind=' + kind + '&at=' + at), { method: 'POST', body: bytes }),
    history: async () => (await (await fetch(api('history'))).json()).history || [],
    async historyBytes(id) {
      const r = await fetch(api('history', '&id=' + encodeURIComponent(id)));
      if (!r.ok) throw new Error('missing');
      return { bytes: new Uint8Array(await r.arrayBuffer()), at: +r.headers.get('X-Saved-At') || 0 };
    },
  });
})();
</script>
</body>
</html>
